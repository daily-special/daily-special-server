spring.application.name=daily-special-server

# 스키마는 Flyway가 소유한다. JPA는 검증만 한다 — 엔티티와 마이그레이션이 어긋나면
# 기동 단계에서 막힌다. ddl-auto=update로 두면 어긋난 채로 굴러가서 나중에 알게 된다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JSON은 snake_case다 (데이터 계약 1-1절). 클라의 Newtonsoft 설정과 같은 모양을 쓴다.
spring.jackson.property-naming-strategy=SNAKE_CASE

# 배포 확인용 최소 노출. 필요해지면 그때 늘린다.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# API 자물쇠. 비어 있으면 필터가 꺼진다 — 로컬과 테스트는 키 없이 돈다.
# 배포에서는 반드시 채운다. 공개 인터넷에 열쇠 없이 올리면 누구나 남의 관계를 바꿀 수 있다.
daily-special.api.key=${DAILY_SPECIAL_API_KEY:}
