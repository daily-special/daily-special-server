# 개발과 배포가 같은 파일을 쓴다.
#
#   로컬   docker compose up -d          → Postgres만. 앱은 bootRun이 돌린다
#                                          (spring-boot-docker-compose가 자동으로 띄우기도 한다)
#   배포   docker compose --profile deploy up -d
#                                        → 앱까지 함께. EC2의 user_data가 이걸 부른다
#
# 파일을 둘로 나누지 않는 이유는, 나누면 로컬에서 검증한 것과 배포되는 것이 달라지기
# 때문이다. 프로파일 하나로 차이를 한 곳에 모은다.
#
# 이미지 태그를 고정한다. `latest`로 두면 어느 날 메이저가 올라가 조용히 깨진다.
# postgres 태그는 TestcontainersConfiguration.java와 **같아야 한다** — 다르면 테스트가
# 통과해도 실서버에서 깨진다. CI가 그 일치를 검사한다.

services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      - 'POSTGRES_DB=daily_special'
      - 'POSTGRES_USER=daily_special'
      # 로컬 기본값이 있고 배포에서는 환경변수가 덮는다.
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-local_only}'
    ports:
      # 호스트 5432에 고정한다. GUI 클라이언트나 psql로 붙어볼 때 포트를 찾지 않아도 된다
      - '5432:5432'
    volumes:
      # Postgres 18+는 마운트를 /var/lib/postgresql에 건다. 17까지의 관례였던
      # /var/lib/postgresql/data에 걸면 컨테이너가 기동을 거부한다
      # (메이저별 하위 디렉터리를 써서 pg_upgrade가 되게 바뀌었다).
      - 'daily-special-pgdata:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daily_special -d daily_special']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    # `./gradlew bootBuildImage`가 만드는 이미지. Dockerfile을 두지 않는다 —
    # Boot의 빌드팩이 JRE 선택과 계층 분리를 알아서 하고, 손으로 쓴 Dockerfile보다
    # 낡을 일이 없다.
    image: '${APP_IMAGE:-daily-special-server:latest}'
    profiles: ['deploy']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - 'SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/daily_special'
      - 'SPRING_DATASOURCE_USERNAME=daily_special'
      - 'SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-local_only}'
      # 비우면 자물쇠가 꺼진다. 배포에서 비면 안 되는데, 그 검사는 여기서 못 한다 —
      # `${VAR:?}`는 프로파일과 무관하게 파싱 때 평가돼서 로컬 `compose up`까지 막는다.
      # 그래서 **배포 스크립트(user_data)가 비어 있지 않은지 확인한 뒤** compose를 부른다.
      - 'DAILY_SPECIAL_API_KEY=${DAILY_SPECIAL_API_KEY:-}'
      # 앱이 compose를 또 띄우려 드는 것을 막는다. 자기 자신을 기동하는 꼴이 된다.
      - 'SPRING_DOCKER_COMPOSE_ENABLED=false'
    ports:
      - '80:8080'
    restart: unless-stopped

volumes:
  daily-special-pgdata:
